<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Feedback Survey</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
    scroll-behavior:smooth;
}

body{
    background:#f4f7fb;
    color:#333;
}

/* Navigation */
nav{
    background:#0d6efd;
    padding:15px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:1000;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 15px;
    font-weight:bold;
    transition: 0.3s;
}

nav a:hover{
    color:#ffc107;
}

header{
    background:#28bebe;
    color:#fff;
    text-align:center;
    padding:50px 20px;
}

header h1{
    font-size:40px;
}

header p{
    margin-top:10px;
    font-size:20px;
}

.container{
    width:80%;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h2{
    color:blue;
    margin-bottom:15px;
}

.btn{
    display:inline-block;
    margin-top:15px;
    padding:12px 25px;
    background:#0d6efd;
    color:white;
    text-decoration:none;
    border:none;
    border-radius:5px;
    font-weight:bold;
    cursor:pointer;
    transition: 0.3s;
}

.btn:hover{
    background:#ffc107;
    color:red;
}

.btn-secondary{
    background:#6c757d;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input[type="text"], input[type="email"], select, textarea{
    width:100%;
    padding:10px;
    border:1px solid #ddd;
    border-radius:5px;
    font-size:16px;
}

input[type="radio"], input[type="checkbox"]{
    margin-right:8px;
}

.option-group label{
    display:block;
    font-weight:normal;
    margin:8px 0;
    cursor:pointer;
}

.result-box{
    background:#eef5ff;
    padding:20px;
    margin:15px 0;
    border-radius:8px;
    border-left:4px solid #0d6efd;
}

.bar{
    background:#ddd;
    border-radius:5px;
    height:20px;
    margin:5px 0 15px 0;
    overflow:hidden;
}

.bar-fill{
    background:#28bebe;
    height:100%;
    border-radius:5px;
    transition: width 0.5s;
}

footer{
    text-align:center;
    background:#0d6efd;
    color:white;
    padding:15px;
    margin-top:20px;
}

@media(max-width:768px){
    .container{
        width:95%;
    }
    header h1{
        font-size:30px;
    }
}
</style>

</head>
<body>

<nav>
    <a href="#home">Home</a>
    <a href="#survey">Take Survey</a>
    <a href="#results">Results</a>
    <a href="#about">About</a>
</nav>
